<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ferma — authorization</title>
<style>body{font-family:system-ui,Arial,sans-serif;max-width:720px;margin:40px auto;padding:0 16px;line-height:1.6;color:#222}code{display:block;word-break:break-all;background:#f3f3f3;padding:12px;border-radius:8px}</style></head><body>
<h1>Ferma — authorization</h1>
<p id="msg">Copy the code below and paste it into the Ferma window on your computer.</p>
<code id="code">—</code>
<script>
const q=new URLSearchParams(location.search);
const c=q.get("code"), e=q.get("error");
document.getElementById("code").textContent = c ? c : (e ? "Error: "+e+" "+(q.get("error_description")||"") : "No code in the link.");
</script>
</body></html>
